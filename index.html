<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>논문 투고 워크스페이스</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="auth-screen" style="display:none;"></div>
<div id="app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div>
        <div class="brand-name">논문 투고 워크스페이스</div>
        <div class="brand-sub">Manuscript Workspace</div>
      </div>
    </div>
    <div class="topbar-right">
      <nav class="tabs">
        <button id="tab-dashboard" class="active" onclick="goTab('dashboard')">프로젝트</button>
        <button id="tab-guide" onclick="goTab('guide')">투고 절차 가이드</button>
        <button id="tab-admin" onclick="goTab('admin')" style="display:none;">관리자</button>
      </nav>
      <div class="user-info" id="user-info"></div>
    </div>
  </header>
  <main id="main-content"></main>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
